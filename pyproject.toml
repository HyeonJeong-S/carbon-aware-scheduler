[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cast"
version = "1.0.0"
description = "CAST — Carbon-Aware Scheduling & Traffic routing: LSTM 탄소강도 예측 + ILP 로드밸런서 + Time-Shift 스케줄러"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "dash>=2.18",
    # 2026-10-12: 상한을 건다. PuLP 4.0.0 이 LpVariable(cat=...) 을 없애
    # load_balancer/framework/simulator.py 의 ILP 가 TypeError 로 죽는다.
    # 4.0.0 은 requires-python >=3.12 라 CI 의 3.12 잡만 그걸 받아 9/24 부터
    # 14개 커밋 연속 실패했다(3.11 은 PuLP 3.x 라 통과). 논문 수치는 PuLP 3.x
    # 로 낸 결과이므로 재현성을 위해서도 그 계열에 묶는다.
    "pulp>=2.9,<4",
    "simpy>=4.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "holidays>=0.40",
]

[project.optional-dependencies]
# 실제 LSTM 예측 — 없으면 더미(사인파+노이즈)로 자동 폴백된다
lstm = ["torch>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cast-dashboard = "interface.dash_app:main"

[tool.setuptools]
packages = [
    "interface", "interface.dashboard", "interface.dashboard.pages", "interface.dashboard.lb_tabs",
    "scheduler",
    "load_balancer", "load_balancer.framework",
    "carbon_forecast_lstm",
]

# ── ruff ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", "_codelens", "*/data/generator/*", "scheduler/data/*", "백업", "paper", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # 줄 길이는 formatter 가 담당
    "C408",    # dict(a=1) 호출 — plotly 레이아웃 코드에서 관용적으로 사용
    "RUF001", "RUF002", "RUF003",  # 한글 문서/주석의 전각 기호 허용
    "B905",    # zip(strict=) — 데이터 길이가 다른 경우를 의도적으로 허용하는 곳이 있음
    "SIM108",  # 삼항 연산자 강제 안 함 (가독성 우선)
]

[tool.ruff.lint.per-file-ignores]
# v2 실험 스크립트(2026-10): 한 줄에 여러 문장·루프 안 클로저(슬롯마다 새로 정의해 그 안에서만 씀)·열린 파일 등 문체 규칙만 끈다. F 계열(미정의 이름 등)은 그대로 검사한다.
"scheduler/joint.py" = ["B023", "E702", "E701", "RUF046", "B007", "F841", "SIM115", "C420"]
"scheduler/run_v2.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420"]
"scheduler/run_priors_v2.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420", "E731", "RUF013", "I001"]
"scheduler/offline_bound.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420"]
"scheduler/match_alpha.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420"]
"scheduler/forecast_shape.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420"]
"scheduler/transfer_sensitivity.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420"]
"scheduler/analysis_alpha.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420", "RUF007"]
"scheduler/analysis_regions.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420", "E731"]
"scheduler/herding.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420", "B023"]
"scheduler/run_scalability.py" = ["E702", "E701", "E401", "B007", "F841", "SIM115", "RUF005", "RUF046", "C420", "UP017", "B023", "RUF059"]
"scheduler/tabulate_v2.py" = ["E702", "E701", "RUF005"]
"scheduler/forecast_checks.py" = ["E702", "E701", "B007", "SIM115"]
"scheduler/forecasters.py" = ["E702", "E701"]
"scheduler/prior_sukprasert.py" = ["E702", "E701", "B007", "F841", "RUF005"]
"tests/test_joint.py" = ["E702", "E701", "F841", "RUF059", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["interface", "scheduler", "load_balancer", "carbon_forecast_lstm"]

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: 실데이터(146k job · LSTM 모델)를 쓰는 통합 테스트 — `pytest -m slow` 로 실행",
]
filterwarnings = ["ignore::DeprecationWarning"]
