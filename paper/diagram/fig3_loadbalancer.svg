    <path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker>
</defs>
<rect width="215" height="214" fill="#fff"/>
<text x="107" y="13" text-anchor="middle" font-size="10" font-weight="bold">공간 이동</text>
<text x="107" y="25" text-anchor="middle" font-size="8">슬롯 단위 ILP 로드밸런서</text>
