<text x="107" y="56" text-anchor="middle" font-size="6.8">예측 Ĉ<tspan font-size="6.5" dy="1.5">r</tspan><tspan dy="-1.5"></tspan>(t) · 지연 ℓ · 직전 작업</text>
<line x1="107" y1="60" x2="107" y2="74" stroke="#000000" stroke-width="1.1" marker-end="url(#a)"/>
<rect x="10" y="74" width="195" height="92" fill="#fff" stroke="#000000" stroke-width="1.3"/>
<text x="107" y="90" text-anchor="middle" font-weight="bold">로드밸런서</text>
<line x1="10" y1="96" x2="205" y2="96" stroke="#000000" stroke-width="0.5"/>
<text x="18" y="112" font-size="8">① α 자동 결정</text>
<text x="28" y="124" font-size="6.8">— 슬롯마다 파레토 무릎점</text>
