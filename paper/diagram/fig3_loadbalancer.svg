<text x="28" y="152" font-size="6.8">— avail<tspan font-size="6.5" dy="1.5">r</tspan><tspan dy="-1.5"></tspan> 이하로 제한</text>
<rect x="47" y="158" width="122" height="16" rx="8" fill="#fff" stroke="#000000" stroke-width="1.1"/>
<text x="107" y="170" text-anchor="middle" font-size="8">배정 x<tspan font-size="6.5" dy="1.5">jr</tspan><tspan dy="-1.5"></tspan></text>
<line x1="107" y1="174" x2="107" y2="186" stroke="#000000" stroke-width="1.1" marker-end="url(#a)"/>
<text x="107" y="194" text-anchor="middle" font-size="8" font-weight="bold">배정 확정 → R<tspan font-size="6.5" dy="1.5">1</tspan><tspan dy="-1.5"></tspan> … R<tspan font-size="6.5" dy="1.5">N</tspan><tspan dy="-1.5"></tspan></text>
