<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 214" width="215pt" height="214pt"
     xml:space="preserve"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"
     font-size="9" fill="#000000">
<defs>
